spring:
  application:
    name: job-matching

  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:job_matching}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 60000
    elasticsearch:
      client:
        uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

  # Spring AI - Mistral Configuration
  ai:
    mistralai:
      api-key: ${MISTRAL_API_KEY:}
      chat:
        options:
          model: mistral-large-latest
          temperature: 0.7
      embedding:
        options:
          model: mistral-embed

  # Security - JWT Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080}
          jwk-set-uri: ${JWT_JWK_SET_URI:}

# Spring Modulith Configuration
spring.modulith:
  events:
    jdbc:
      schema-initialization:
        enabled: true

# S3/MinIO Configuration
s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  access-key: ${S3_ACCESS_KEY:minioadmin}
  secret-key: ${S3_SECRET_KEY:minioadmin}
  bucket:
    resumes: ${S3_BUCKET_RESUMES:resumes}
  region: ${S3_REGION:us-east-1}

# Application Settings
app:
  jwt:
    secret: ${JWT_SECRET:job-matching-secret-key-change-in-production}
    access-token-expiration: 900000  # 15 minutes
    refresh-token-expiration: 604800000  # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  matching:
    weights:
      skills: 0.40
      experience: 0.25
      location: 0.15
      salary: 0.15
      culture: 0.05

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.isaac.job_matching: DEBUG
    org.springframework.modulith: INFO
    org.springframework.ai: DEBUG

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    filter: true
    show-extensions: true
  show-actuator: false
  packages-to-scan: com.isaac.job_matching
  paths-to-match: /api/**
